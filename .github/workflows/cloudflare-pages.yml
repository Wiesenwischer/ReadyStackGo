name: Deploy PublicWeb to Cloudflare Pages

# The production site is only rolled out with a release (tag v*). Merges to main do not deploy.
# Pull requests get a preview deployment on their own branch.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/ReadyStackGo.PublicWeb/**'
      - '.github/workflows/cloudflare-pages.yml'
  # Started by milestone-release.yml (a tag pushed with GITHUB_TOKEN does not trigger workflows),
  # or by hand to redeploy a release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g., v0.84.0)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/ReadyStackGo.PublicWeb/package-lock.json

      - name: Install dependencies
        working-directory: src/ReadyStackGo.PublicWeb
        run: npm ci

      - name: Build
        working-directory: src/ReadyStackGo.PublicWeb
        run: npm run build

      - name: Determine branch name
        id: branch
        run: |
          # Pull requests deploy a preview on their branch; releases go to the production branch "main".
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "name=main" >> $GITHUB_OUTPUT
          fi

      # cloudflare/pages-action is archived and can no longer be resolved; wrangler-action replaces it.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy src/ReadyStackGo.PublicWeb/dist --project-name=readystackgo --branch="${{ steps.branch.outputs.name }}" --commit-dirty=true

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const body = `## 🚀 Cloudflare Pages Preview\n\nPreview deployment ready!\n\n**URL:** ${url}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.body.includes('Cloudflare Pages Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
