name: CI

on:
  pull_request:
    branches: [main]
  # The Vorhaben workflow starts the CI of its own pull requests by hand (works/docs/prozesse/vorhaben.md, "Technik").
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  # 22.x is the floor for vitest 5 (and matches the local toolchain).
  NODE_VERSION: '22.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'src/ReadyStackGo.WebUi/pnpm-lock.yaml'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/ReadyStackGo.UnitTests/ReadyStackGo.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"

      - name: Run Integration Tests
        run: dotnet test tests/ReadyStackGo.IntegrationTests/ReadyStackGo.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

      - name: Run Domain Tests
        run: dotnet test tests/ReadyStackGo.DomainTests/ReadyStackGo.DomainTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=domain-test-results.trx"

      - name: Install frontend dependencies
        working-directory: src/ReadyStackGo.WebUi
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        working-directory: src/ReadyStackGo.WebUi
        run: pnpm run lint

      - name: Type Check Frontend
        working-directory: src/ReadyStackGo.WebUi
        run: pnpm exec tsc -b

      - name: Run Frontend Unit Tests
        working-directory: src/ReadyStackGo.WebUi
        run: pnpm run test

      - name: Build frontend
        working-directory: src/ReadyStackGo.WebUi
        run: pnpm run build

      # Single sign-on against the container with the test identity provider (plan
      # docs/plans/identity-provider-vorlagen.md E29). Never calls WYSCH.
      - name: Install Playwright Chromium
        working-directory: src/ReadyStackGo.WebUi
        run: pnpm exec playwright install --with-deps chromium

      - name: Single sign-on browser test
        run: bash scripts/sso-e2e.sh

      - name: Upload single sign-on browser test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sso-e2e-report
          path: |
            src/ReadyStackGo.WebUi/playwright-report/
            src/ReadyStackGo.WebUi/test-results/
            sso-e2e-containers.log
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*-test-results.trx'
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/ReadyStackGo.Api/bin/Release/
            src/ReadyStackGo.Api/wwwroot/
          retention-days: 7
